<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Gaze Choice Board</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --text-dark: #1a1a2e;
      --interactive: #003f88;
      --interactive-soft: #e8f1ff;
      --success: #005f2e;
      --alert: #9f0000;
      --bg-warm: #f9f7f2;
      --bg-dark: #1a1a2e;
      --button-bg: #ffffff;
      --button-border: #2f3445;
      --dwell-colour: var(--interactive);
      --dwell-hover-bg: var(--interactive-soft);
      --dwell-complete-colour: var(--success);
      --btn-border-radius: 16px;
      --target-min: 150px;
      --target-gap: 24px;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg-warm);
      color: var(--text-dark);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-width: 320px;
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 18px;
      height: 100vh;
      padding: 24px;
    }

    .top-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--target-gap);
      align-items: stretch;
    }

    .utility-bar {
      display: grid;
      grid-template-columns: repeat(2, 160px);
      gap: var(--target-gap);
    }

    .prompt {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 120px;
      padding: 22px 28px;
      border-radius: 16px;
      background: var(--bg-dark);
      color: #ffffff;
    }

    .prompt h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .prompt p {
      margin: 0;
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      line-height: 1.25;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: var(--target-gap);
      min-height: 0;
    }

    .dwell-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: var(--target-min);
      min-height: var(--target-min);
      padding: 1.25rem;
      border: 4px solid var(--button-border);
      border-radius: var(--btn-border-radius);
      background: var(--button-bg);
      color: var(--text-dark);
      cursor: pointer;
      overflow: hidden;
      font: inherit;
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      -webkit-appearance: none;
      appearance: none;
      user-select: none;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .dwell-btn:hover,
    .dwell-btn:focus-visible,
    .dwell-btn.is-dwelling {
      background: var(--dwell-hover-bg);
      border-color: var(--dwell-colour);
      outline: 4px solid var(--dwell-colour);
      outline-offset: 3px;
    }

    .dwell-btn:hover,
    .dwell-btn.is-dwelling {
      transform: scale(1.015);
    }

    .dwell-btn.dwell-complete {
      background: #e7f6ea;
      border-color: var(--dwell-complete-colour);
      outline-color: var(--dwell-complete-colour);
    }

    .dwell-btn.utility {
      width: 160px;
      min-width: 160px;
      min-height: 120px;
      font-size: 1.15rem;
    }

    .dwell-btn[hidden] {
      display: none;
    }

    .btn-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      pointer-events: none;
    }

    .btn-symbol {
      display: grid;
      place-items: center;
      width: 84px;
      height: 84px;
      border: 3px solid #d3d8e6;
      border-radius: 14px;
      background: #f7f9fc;
      color: var(--text-dark);
      font-size: 2rem;
      font-weight: 900;
    }

    .btn-label {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .dwell-ring {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: calc(var(--btn-border-radius) - 2px);
      background: conic-gradient(var(--dwell-colour) 0%, transparent 0%);
      opacity: 0.22;
      pointer-events: none;
    }

    .dwell-btn.is-dwelling .dwell-ring {
      opacity: 0.34;
    }

    .dwell-btn.dwell-complete .dwell-ring {
      background: conic-gradient(var(--dwell-complete-colour) 100%, transparent 0%);
      opacity: 0.42;
    }

    .status {
      min-height: 70px;
      padding: 14px 20px;
      border-left: 8px solid var(--interactive);
      background: #ffffff;
      color: var(--text-dark);
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .confirm-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 36px;
      background: rgba(26, 26, 46, 0.72);
    }

    .confirm-modal.visible {
      display: flex;
    }

    .confirm-panel {
      width: min(900px, 100%);
      padding: 28px;
      border-radius: 18px;
      background: #ffffff;
      color: var(--text-dark);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
    }

    .confirm-panel h2 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .confirm-panel p {
      margin: 0 0 24px;
      font-size: 1.6rem;
      font-weight: 800;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--target-gap);
      min-height: 240px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      .app {
        padding: 14px;
      }

      .top-bar {
        grid-template-columns: 1fr;
      }

      .utility-bar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dwell-btn.utility {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dwell-btn {
        transition: none;
      }

      .dwell-btn:hover,
      .dwell-btn.is-dwelling {
        transform: none;
      }
    }

    @media (forced-colors: active) {
      .dwell-btn {
        border: 3px solid ButtonText;
        background: ButtonFace;
        color: ButtonText;
        forced-color-adjust: auto;
      }

      .dwell-btn:hover,
      .dwell-btn:focus-visible,
      .dwell-btn.is-dwelling {
        outline: 4px solid Highlight;
        border-color: Highlight;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top-bar">
      <section class="prompt" aria-labelledby="activityTitle">
        <h1 id="activityTitle">Choice Board</h1>
        <p id="activityPrompt">What would you like to say?</p>
      </section>
      <div class="utility-bar" aria-label="Display and speech controls">
        <button class="dwell-btn utility" id="fullScreenButton" type="button" data-action="fullscreen" data-dwell-time="800" aria-label="Start full screen">
          <span class="btn-content">
            <span class="btn-symbol" aria-hidden="true">FULL</span>
            <span class="btn-label">Full Screen</span>
          </span>
          <span class="dwell-ring" aria-hidden="true"></span>
        </button>
        <button class="dwell-btn utility" type="button" data-action="stop-speech" data-dwell-time="600" aria-label="Stop speech">
          <span class="btn-content">
            <span class="btn-symbol" aria-hidden="true">STOP</span>
            <span class="btn-label">Stop Speech</span>
          </span>
          <span class="dwell-ring" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <section class="choice-grid" id="choiceGrid" aria-label="Choices"></section>

    <section class="status" id="status" aria-live="polite">For best eye-gaze access, choose Full Screen.</section>
  </main>

  <div class="confirm-modal" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="confirm-panel">
      <h2 id="confirmTitle">Choose this?</h2>
      <p id="confirmLabel"></p>
      <div class="confirm-actions">
        <button class="dwell-btn confirm-btn" data-confirm="yes" data-dwell-time="600" aria-label="Yes, choose this">
          <span class="btn-content">
            <span class="btn-symbol" aria-hidden="true">YES</span>
            <span class="btn-label">Yes</span>
          </span>
          <span class="dwell-ring" aria-hidden="true"></span>
        </button>
        <button class="dwell-btn confirm-btn" data-confirm="no" data-dwell-time="600" aria-label="No, go back">
          <span class="btn-content">
            <span class="btn-symbol" aria-hidden="true">NO</span>
            <span class="btn-label">No</span>
          </span>
          <span class="dwell-ring" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const ACTIVITY = {
      title: 'Choice Board',
      prompt: 'What would you like to say?',
      dwellTime: 800,
      confirmChoices: false,
      choices: [
        { id: 'help', label: 'Help', speech: 'Help, please.', symbol: 'HELP' },
        { id: 'more', label: 'More', speech: 'More, please.', symbol: 'MORE' },
        { id: 'different', label: 'Different', speech: 'I want something different.', symbol: 'DIFF' },
        { id: 'finished', label: 'Finished', speech: 'I am finished.', symbol: 'DONE' }
      ]
    };

    class DwellManager {
      constructor(options = {}) {
        this.defaultDwellTime = options.dwellTime || 800;
        this.cooldownTime = options.cooldownTime || 450;
        this.onActivate = options.onActivate || null;
        this.audioCues = options.audioCues || false;
        this.dwellOnFocus = options.dwellOnFocus || false;
        this.activeButton = null;
        this.animationTimer = null;
        this.dwellStart = 0;
        this.cooldownActive = false;
        this.boundButtons = new WeakSet();
        this.exitRequired = new WeakSet();
        this.audioContext = null;
      }

      attach(buttons, callback) {
        if (callback) this.onActivate = callback;
        Array.from(buttons).forEach((button) => {
          if (this.boundButtons.has(button)) return;
          this.boundButtons.add(button);

          const enterEvent = window.PointerEvent ? 'pointerenter' : 'mouseenter';
          const leaveEvent = window.PointerEvent ? 'pointerleave' : 'mouseleave';
          button.addEventListener(enterEvent, () => this.handleEnter(button));
          button.addEventListener(leaveEvent, () => this.handleLeave(button));

          if (this.dwellOnFocus) {
            button.addEventListener('focus', () => this.handleEnter(button));
            button.addEventListener('blur', () => this.handleLeave(button));
          }

          // Plain click listener on a native <button>: Enter/Space already
          // fire click, and synthesised assistive-technology clicks carry
          // event.detail === 0, so do NOT guard on event.detail. The
          // cooldown check in activate() absorbs any duplicate event.
          button.addEventListener('click', () => this.activate(button, 'click'));

          // Escape cancels an in-progress dwell.
          button.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') this.cancel(button);
          });
        });
      }

      handleEnter(button) {
        if (button.disabled || this.activeButton || this.exitRequired.has(button)) return;
        this.activeButton = button;
        this.dwellStart = performance.now();
        button.classList.add('is-dwelling');
        this.tone(440, 0.025, 0.04);

        const dwellTime = Number.parseInt(button.dataset.dwellTime, 10) || this.defaultDwellTime;
        const animate = (timestamp) => {
          if (this.activeButton !== button) return;
          const progress = Math.min((timestamp - this.dwellStart) / dwellTime, 1);
          this.updateRing(button, progress);
          if (progress >= 1) this.activate(button, 'dwell');
          else this.animationTimer = window.requestAnimationFrame(animate);
        };

        this.animationTimer = window.requestAnimationFrame(animate);
      }

      handleLeave(button) {
        this.exitRequired.delete(button);
        if (this.activeButton === button) this.cancel(button);
      }

      activate(button, method = 'manual') {
        if (button.disabled || this.cooldownActive) return;
        if (this.animationTimer) window.cancelAnimationFrame(this.animationTimer);
        this.animationTimer = null;
        this.activeButton = null;
        this.cooldownActive = true;
        this.exitRequired.add(button);
        button.classList.remove('is-dwelling');
        button.classList.add('dwell-complete');
        this.updateRing(button, 1);
        this.tone(660, 0.035, 0.08);

        window.setTimeout(() => {
          button.classList.remove('dwell-complete');
          this.resetRing(button);
          if (this.onActivate) this.onActivate(button, method);
          window.setTimeout(() => {
            this.cooldownActive = false;
          }, this.cooldownTime);
        }, 180);
      }

      cancel(button) {
        if (this.animationTimer) window.cancelAnimationFrame(this.animationTimer);
        this.animationTimer = null;
        this.activeButton = null;
        this.dwellStart = 0;
        button.classList.remove('is-dwelling', 'dwell-complete');
        this.resetRing(button);
      }

      updateRing(button, progress) {
        const ring = button.querySelector('.dwell-ring');
        if (!ring) return;
        const pct = Math.round(progress * 100);
        ring.style.background = `conic-gradient(var(--dwell-colour) ${pct}%, transparent ${pct}%)`;
      }

      resetRing(button) {
        const ring = button.querySelector('.dwell-ring');
        if (!ring) return;
        ring.style.background = 'conic-gradient(var(--dwell-colour) 0%, transparent 0%)';
      }

      tone(frequency, volume, duration) {
        if (!this.audioCues) return;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!this.audioContext) this.audioContext = new AudioContextClass();
          const osc = this.audioContext.createOscillator();
          const gain = this.audioContext.createGain();
          osc.connect(gain);
          gain.connect(this.audioContext.destination);
          osc.frequency.value = frequency;
          gain.gain.value = volume;
          osc.start();
          osc.stop(this.audioContext.currentTime + duration);
        } catch (error) {}
      }
    }

    const statusEl = document.getElementById('status');
    const confirmModal = document.getElementById('confirmModal');
    const confirmLabel = document.getElementById('confirmLabel');
    let pendingConfirm = null;

    function speakAU(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-AU';
      utterance.rate = 0.85;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    const fullScreenButton = document.getElementById('fullScreenButton');

    function requestFullScreen(source = 'button') {
      if (document.fullscreenElement) return Promise.resolve(true);
      if (!document.documentElement.requestFullscreen) {
        setStatus('Full screen is unavailable. Press F11 or ask EQ IT for kiosk mode.');
        return Promise.resolve(false);
      }

      // Keep this call synchronous with the native click handler below.
      return document.documentElement.requestFullscreen().then(() => {
        setStatus('Full screen is on. Press Escape to leave.');
        return true;
      }).catch(() => {
        if (source === 'startup') {
          setStatus('For best eye-gaze access, choose Full Screen. EQ IT can allow automatic full screen.');
        } else {
          setStatus('Full screen was blocked. Use click or Enter, press F11, or ask EQ IT for managed full screen.');
        }
        return false;
      });
    }

    function updateFullScreenControl() {
      if (!fullScreenButton) return;
      fullScreenButton.hidden = Boolean(document.fullscreenElement);
      if (!document.fullscreenElement) setStatus('For best eye-gaze access, choose Full Screen.');
    }

    function makeChoiceButton(choice) {
      const button = document.createElement('button');
      button.className = 'dwell-btn';
      button.type = 'button';
      button.dataset.choiceId = choice.id;
      button.dataset.speech = choice.speech || choice.label;
      button.dataset.dwellTime = String(choice.dwellTime || ACTIVITY.dwellTime);
      button.setAttribute('aria-label', choice.ariaLabel || choice.label);
      button.innerHTML = `
        <span class="btn-content">
          <span class="btn-symbol" aria-hidden="true">${choice.symbol || choice.label.slice(0, 4).toUpperCase()}</span>
          <span class="btn-label">${choice.label}</span>
        </span>
        <span class="dwell-ring" aria-hidden="true"></span>
      `;
      return button;
    }

    function renderActivity() {
      document.getElementById('activityTitle').textContent = ACTIVITY.title;
      document.getElementById('activityPrompt').textContent = ACTIVITY.prompt;
      const grid = document.getElementById('choiceGrid');
      grid.replaceChildren(...ACTIVITY.choices.map(makeChoiceButton));
    }

    function handleChoice(button) {
      const choice = ACTIVITY.choices.find((item) => item.id === button.dataset.choiceId);
      if (!choice) return;
      const complete = () => {
        setStatus(choice.label);
        speakAU(choice.speech || choice.label);
      };

      if (ACTIVITY.confirmChoices) {
        showConfirmation(choice.label, complete);
      } else {
        complete();
      }
    }

    let lastFocus = null;

    function showConfirmation(label, onConfirm) {
      pendingConfirm = onConfirm;
      lastFocus = document.activeElement;
      confirmLabel.textContent = label;
      confirmModal.classList.add('visible');
      confirmModal.setAttribute('aria-hidden', 'false');
      const yesButton = confirmModal.querySelector('.confirm-btn[data-confirm="yes"]');
      if (yesButton) yesButton.focus();
      setStatus(`Confirm: ${label}`);
      speakAU(`Choose ${label}?`);
    }

    function closeConfirmation() {
      pendingConfirm = null;
      confirmModal.classList.remove('visible');
      confirmModal.setAttribute('aria-hidden', 'true');
      if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
      lastFocus = null;
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && confirmModal.classList.contains('visible')) {
        closeConfirmation();
        setStatus('Cancelled.');
      }
    });

    renderActivity();

    // Attach this direct listener before DwellManager.attach(). A trusted
    // click/Enter/OS dwell click must call requestFullscreen synchronously.
    fullScreenButton.addEventListener('click', () => {
      requestFullScreen('click');
    });
    document.addEventListener('fullscreenchange', updateFullScreenControl);

    const mainDwell = new DwellManager({ dwellTime: ACTIVITY.dwellTime });
    mainDwell.attach(document.querySelectorAll('.dwell-btn:not(.confirm-btn)'), (button) => {
      if (confirmModal.classList.contains('visible')) return;
      if (button.dataset.action === 'fullscreen') {
        requestFullScreen('dwell');
        return;
      }
      if (button.dataset.action === 'stop-speech') {
        stopSpeech();
        setStatus('Speech stopped.');
        return;
      }
      handleChoice(button);
    });

    const confirmDwell = new DwellManager({ dwellTime: 600 });
    confirmDwell.attach(document.querySelectorAll('.confirm-btn'), (button) => {
      const action = pendingConfirm;
      closeConfirmation();
      if (button.dataset.confirm === 'yes' && action) action();
      if (button.dataset.confirm === 'no') setStatus('Cancelled.');
    });

    // EQ-managed Edge 132+ can allow this startup call through
    // AutomaticFullscreenAllowedForUrls. Ordinary Edge will reject it and
    // leave the gaze-sized button and F11 guidance available.
    window.addEventListener('load', () => {
      requestFullScreen('startup');
    }, { once: true });

    window.checkEyeGazeTargets = function checkEyeGazeTargets() {
      document.querySelectorAll('button').forEach((button) => {
        if (button.offsetParent === null) return;
        const rect = button.getBoundingClientRect();
        const ok = rect.width >= 120 && rect.height >= 120;
        console.log(`${ok ? 'OK' : 'CHECK'} ${button.getAttribute('aria-label') || button.textContent.trim()} - ${Math.round(rect.width)}x${Math.round(rect.height)}px`);
      });
    };
  </script>
</body>
</html>

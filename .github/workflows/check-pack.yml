name: Check pack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-pack:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run release checks
        run: python3 scripts/check_pack.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

  claude-plugin-validate:
    # Structural validation with the official Claude Code CLI. Marked
    # continue-on-error until confirmed to run cleanly in CI, so it cannot
    # block releases while it is being trialled.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest and components
        run: claude plugin validate . --strict

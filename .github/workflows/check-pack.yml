name: Check pack

on:
  push:
  pull_request:

jobs:
  check-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run release checks
        run: python3 scripts/check_pack.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

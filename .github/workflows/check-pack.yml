name: Check pack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run release checks
        run: python3 scripts/check_pack.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests
